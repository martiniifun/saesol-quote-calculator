<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수출 견적 계산기 (FOB / CIF)</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; background: #f5f5f5; margin: 0; padding: 24px; color: #222; }
  .card { max-width: 480px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  h1 { font-size: 20px; margin-top: 0; }
  label { display: block; margin-top: 14px; font-size: 14px; font-weight: bold; }
  input, select { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-size: 15px; }
  .hint { font-weight: normal; color: #888; font-size: 12px; }
  button { margin-top: 20px; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: #fff; background: #F28C28; border: 0; border-radius: 6px; cursor: pointer; }
  button:hover { filter: brightness(0.95); }
  table { width: 100%; margin-top: 20px; border-collapse: collapse; }
  td { padding: 8px 4px; border-bottom: 1px solid #eee; }
  td:last-child { text-align: right; }
  tr.main td { font-weight: bold; font-size: 17px; }
  [hidden] { display: none !important; }
  .err { color: #c00; margin-top: 12px; font-size: 14px; }
  .note { color: #888; font-size: 12px; margin-top: 16px; }
  .btn-print { background: #2b6cb0; margin-top: 12px; }
  #sheet { display: none; }
  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; padding: 0; }
    .card { display: none !important; }
    #sheet { display: block; width: 210mm; height: 296mm; box-sizing: border-box; padding: 25mm 20mm; overflow: hidden; }
  }
  #sheet h2 { font-size: 28px; text-align: center; letter-spacing: 12px; margin: 0 0 24px; }
  #sheet .co { font-size: 18px; font-weight: bold; }
  #sheet .meta { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; border-bottom: 2px solid #222; padding-bottom: 8px; }
  #sheet table { margin-top: 0; font-size: 15px; }
  #sheet th, #sheet td { border: 1px solid #999; padding: 10px 8px; }
  #sheet th { background: #f0f0f0; }
  #sheet td:last-child { text-align: left; }
  #sheet td.num { text-align: right; }
  #sheet .total td { font-weight: bold; font-size: 18px; background: #fafafa; }
  #sheet .foot { margin-top: 24px; font-size: 12px; color: #555; }
</style>
</head>
<body>
<div class="card">
  <h1>수출 견적 계산기 (FOB / CIF)</h1>

  <label for="item">품목</label>
  <select id="item"></select>

  <label for="term">조건</label>
  <select id="term">
    <option value="FOB">FOB</option>
    <option value="CIF">CIF</option>
  </select>

  <div id="region-wrap" hidden>
    <label for="region">도착 지역</label>
    <select id="region">
      <option value="일본">일본</option>
      <option value="동남아">동남아 (베트남·태국 등)</option>
    </select>
  </div>

  <label for="qty">수량(개)</label>
  <input id="qty" type="number" min="1" step="1" value="125">

  <label for="margin">마진율(%)</label>
  <input id="margin" type="number" min="0" step="any" value="12">

  <label for="rate">환율(원/USD) <span class="hint">· 입력값 (실제 환율 아님)</span></label>
  <input id="rate" type="number" min="0" step="any" value="1380">

  <label for="jpyrate">엔화 환율(원/100엔) <span class="hint">· 입력값 (실제 환율 아님)</span></label>
  <input id="jpyrate" type="number" min="0" step="any" value="900">

  <button id="calc" type="button">계산</button>
  <div id="err" class="err"></div>

  <table id="result" hidden>
    <tr><td>박스 수</td><td id="r-box"></td></tr>
    <tr><td>FOB 원가</td><td id="r-fob"></td></tr>
    <tr class="cif-row"><td>해상운임</td><td id="r-freight"></td></tr>
    <tr class="cif-row"><td>보험료</td><td id="r-ins"></td></tr>
    <tr class="cif-row"><td>CIF 원가</td><td id="r-cif"></td></tr>
    <tr><td>견적가(원)</td><td id="r-krw"></td></tr>
    <tr class="main"><td>견적가(USD)</td><td id="r-usd"></td></tr>
    <tr class="main"><td>견적가(JPY)</td><td id="r-jpy"></td></tr>
  </table>
  <button id="print" type="button" class="btn-print" hidden>견적서 인쇄 (A4)</button>
  <div class="note">포장비 박스당 1,200원 · 내륙 운송비 박스당 800원 포함 / CIF: 해상운임 박스당 일본 1,800원·동남아 2,500원, 보험료 FOB 원가의 0.2% / 환율은 입력값입니다. 엔화는 원/100엔 기준, 1엔 단위로 반올림합니다.</div>
</div>

<div id="sheet">
  <h2>견 적 서</h2>
  <div class="meta">
    <div class="co">새솔물산</div>
    <div>견적 날짜: <span id="s-date"></span></div>
  </div>
  <table>
    <tr><th>품목</th><th>수량</th><th>조건</th><th>금액(USD)</th></tr>
    <tr><td id="s-item"></td><td id="s-qty" class="num"></td><td id="s-term"></td><td id="s-usd1" class="num"></td></tr>
    <tr class="total"><td colspan="3">총액 (Total)</td><td id="s-usd" class="num"></td></tr>
  </table>
  <div class="foot">환율 1 USD = <span id="s-rate"></span> 원 기준</div>
</div>

<script src="calc.js"></script>
<script>
// 단가표.csv 내용 (file:// 에서는 CSV를 불러올 수 없어 내장)
const CSV = `품목코드,품목명,단가(원),박스당 수량
YJ01,유자차 1kg 병,6800,12
MG01,건조 망고 1kg,9500,10
GS20,김 스낵 20g×30,7200,20
MY05,건미역 500g,5400,24
GJ01,고추장 1kg,4900,12
OM10,오미자청 1L,12000,6`;

const items = CSV.trim().split("\n").slice(1).map(l => {
  const [code, name, price, perBox] = l.split(",");
  return { code, name, price: +price, perBox: +perBox };
});

const $ = id => document.getElementById(id);
items.forEach((it, i) => {
  const o = document.createElement("option");
  o.value = i;
  o.textContent = `${it.code} · ${it.name} (${it.price.toLocaleString("en-US")}원, 박스당 ${it.perBox}개)`;
  $("item").appendChild(o);
});
$("item").value = 1; // MG01

const fmtWon = n => n.toLocaleString("en-US") + " 원";
const showCif = on => {
  document.querySelectorAll(".cif-row").forEach(tr => { tr.hidden = !on; });
  $("region-wrap").hidden = !on;
};
showCif(false);
$("term").onchange = () => { showCif($("term").value === "CIF"); $("result").hidden = true; $("print").hidden = true; };
$("print").onclick = () => window.print();

$("calc").onclick = () => {
  const it = items[$("item").value];
  const term = $("term").value, region = $("region").value;
  const qty = +$("qty").value, margin = +$("margin").value, rate = +$("rate").value, jpyRate = +$("jpyrate").value;
  const err = $("err");
  if (!Number.isInteger(qty) || qty < 1) { return fail("수량은 1 이상의 정수여야 합니다."); }
  if (!(margin >= 0)) { return fail("마진율은 0 이상이어야 합니다."); }
  if (!(rate > 0)) { return fail("환율은 0보다 커야 합니다."); }
  if (!(jpyRate > 0)) { return fail("엔화 환율은 0보다 커야 합니다."); }
  err.textContent = "";

  const { boxes, fob, freight, insurance, cif, krw, usd, jpy } =
    Calc.calcQuote(it, qty, margin, rate, { term, region, jpyRate });

  $("r-box").textContent = boxes.toLocaleString("en-US") + " 박스";
  $("r-fob").textContent = fmtWon(fob);
  if (term === "CIF") {
    $("r-freight").textContent = fmtWon(freight);
    $("r-ins").textContent = fmtWon(insurance);
    $("r-cif").textContent = fmtWon(cif);
  }
  $("r-krw").textContent = fmtWon(krw);
  $("r-usd").textContent = "USD " + usd.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  $("r-jpy").textContent = "JPY " + jpy.toLocaleString("en-US");
  $("result").hidden = false;

  const usdText = "USD " + usd.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const d = new Date();
  $("s-date").textContent = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  $("s-item").textContent = `${it.code} · ${it.name}`;
  $("s-qty").textContent = qty.toLocaleString("en-US") + " 개";
  $("s-term").textContent = term === "CIF" ? `CIF (도착 지역: ${region})` : "FOB";
  $("s-usd1").textContent = usdText;
  $("s-usd").textContent = usdText;
  $("s-rate").textContent = rate.toLocaleString("en-US");
  $("print").hidden = false;

  function fail(msg) { err.textContent = msg; $("result").hidden = true; $("print").hidden = true; }
};
</script>
</body>
</html>
